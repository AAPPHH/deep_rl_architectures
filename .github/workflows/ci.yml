name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy: ["numpy>=1.26,<2", "numpy>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch==2.9.*" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "${{ matrix.numpy }}"
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest actor_critic.tests.test_actor_critic actor_critic.tests.test_sil
        env:
          CUDA_VISIBLE_DEVICES: ""
