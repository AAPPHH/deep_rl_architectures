[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-rl-architectures"
dynamic = ["version"]
description = "Shared IMPALA (V-trace) and DreamerV3 algorithm code"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
ray = ["ray"]
lake = ["pyarrow", "duckdb", "pandas"]

[tool.setuptools]
packages = ["deep_rl_architectures", "deep_rl_architectures.tests"]

[tool.setuptools.package-data]
"deep_rl_architectures.tests" = ["*.pt"]

[tool.setuptools.dynamic]
version = {attr = "deep_rl_architectures.__version__"}
